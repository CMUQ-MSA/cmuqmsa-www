pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/png;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            add_header Content-Type text/plain;
            try_files /healthz =404;
        }

        location = /calendar.ics {
            resolver 1.1.1.1 ipv6=off valid=300s;
            set $ics https://static-prod-us-east-1.campusgroups.com/ical/cmu/ical_cmu.ics;
            proxy_ssl_server_name on;
            proxy_set_header Host static-prod-us-east-1.campusgroups.com;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_pass $ics;
            add_header Cache-Control "public, max-age=300";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location ~* \.(?:css|js|json)$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
